<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tick Bags Attendance</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f4f7fb; color:#303342; }
    .card { width:min(420px, calc(100vw - 32px)); background:#fff; border:1px solid #dce3f1; border-radius:8px; box-shadow:0 18px 45px rgba(40,48,73,.10); padding:28px; }
    h1 { margin:0 0 6px; font-size:28px; letter-spacing:0; }
    p { margin:0 0 24px; color:#858b9d; font-size:16px; line-height:1.5; }
    label { display:block; margin:14px 0 7px; font-size:12px; font-weight:800; color:#858b9d; letter-spacing:.08em; text-transform:uppercase; }
    input { box-sizing:border-box; width:100%; border:1px solid #d8e0ef; border-radius:8px; padding:14px 16px; font-size:16px; outline:none; }
    input:focus { border-color:#4e73df; box-shadow:0 0 0 3px rgba(78,115,223,.12); }
    button { width:100%; margin-top:20px; border:0; border-radius:8px; background:#4e73df; color:#fff; padding:14px 16px; font-size:16px; font-weight:800; cursor:pointer; }
    .error { margin:0 0 16px; padding:10px 12px; border-radius:8px; background:#fce8e6; color:#9f2216; font-weight:700; }
  </style>
</head>
<body>
  <form class="card" method="post">
    <h1>Attendance</h1>
    <p>Sign in to mark check-in or check-out from the office.</p>
    {% if login_error %}<div class="error">{{ login_error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next_url }}">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autofocus required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign In</button>
  </form>
</body>
</html>
